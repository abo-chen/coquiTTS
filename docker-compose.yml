services:
  coqui-tts-gpu:
    build:
      context: .
      dockerfile: Dockerfile.xtts
    image: coqui-tts-gpu:latest
    container_name: coqui-tts-gpu-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      # 模型缓存目录 绝对地址，请根据实际情况填写
      # Todo: raplace "/home/abel" to you path
      - /home/abel/tts-cache:/root/.local/share/tts
      # 输入输出目录
      - ./tts-input:/root/tts-input
      - ./tts-output:/root/tts-output
      # 挂载当前项目目录用于调试（覆盖容器内的TTS目录）
      - ./TTS:/root/TTS
    environment:
      - COQUI_TOS_AGREED=1
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: python3
    command: >
      TTS/server/server.py
      --model_path /root/.local/share/tts/tts_models--multilingual--multi-dataset--xtts_v2
      --config_path /root/.local/share/tts/tts_models--multilingual--multi-dataset--xtts_v2/config.json
      --port 5002
      --use_cuda true
      --show_details true

  # 可选：用于下载模型的服务（按需启动）
  model-downloader:
    image: ghcr.io/coqui-ai/tts:latest
    container_name: coqui-model-downloader
    profiles: ["download"]
    volumes:
    # Todo: raplace "/home/abel" to you path
      - /home/abel/tts-cache:/root/.local/share/tts
    environment:
      - COQUI_TOS_AGREED=1
    command: >
      --model_name tts_models/multilingual/multi-dataset/xtts_v2
      --text "hello world"